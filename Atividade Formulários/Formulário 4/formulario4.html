<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="geral">
    <form class="formulario">
       <h1>Formulário de Cadastro</h1>
        <div class="linha">
            <label>Nome e<br> Sobrenome</label>
            <div class="campos-nome">
            <div>
               <input type="text" required>
                <small>Nome</small>
                </div>
                <div>
                <input type="text" required>
                <small>Sobrenome</small>
                </div>
                </div>
            </div>
            <div class="linha">
                <label for="empresa">Empresa</label>
                <input type="text" id="empresa">
            </div>
            <div class="linha">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="linha">
                <label>Telefone com<br> DDD</label>
                <div class="campos-telefone">
                <div>
                <input type="text" maxlength="2">
                <small>DDD</small>
                </div>
                <div>
                <input type="tel">
                <small>Telefone</small>
                </div>
                </div>
            </div>
            <div class="linha">
                <label for="sexo">Sexo</label>
                <select id="sexo">
                <option value="">--Selecione a Opção</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
                </select>
            </div>
            <div class="iniciante">
                <label>Você é iniciante?</label>
                <div class="opcoes">
                <label>
                <input type="radio" name="iniciante" value="sim">
                Sim
                </label>
                <label>
                <input type="radio" name="iniciante" value="nao">
                Não
                </label>
                </div>
            </div>
            <button type="submit">Enviar</button>
        </form>
    </div>  
</body>
</html>
