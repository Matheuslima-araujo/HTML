<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">
        <header class="header">
        <h1>Reserve sua Mesa</h1>
        <p>
        Por favor, preencha o formulário abaixo com atenção para que possamos
        atendê-lo da melhor forma possível. Seja bem-vindo!
        </p>
        </header>
        <form class="reserva-form">
        <div class="formulario">
            <label>Nome Completo</label>
            <div class="form-row">
                <div>
                    <input type="text" id="nome" name="nome" required>
                    <small>Nome</small>
                    </div>
                    <div>
                    <input type="text" id="sobrenome" name="sobrenome" required>
                    <small>Sobrenome</small>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ex: myname@example.com"
                    required
                >
            </div>
            <div class="form-row">
                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    required
                >
            </div>
            <div class="form-row">
                <label for="pessoas">Número de Pessoas</label>
                <input
                    type="number"
                    id="pessoas"
                    name="pessoas"
                    min="1"
                    required
                >
            </div>
            <div class="section-title">
                <h2>Reserva</h2>
            </div>
            <div class="form-row">
                <label for="tipo">Tipo de Reserva</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Please Select</option>
                    <option value="almoco">Almoço</option>
                    <option value="jantar">Jantar</option>
                    <option value="aniversario">Aniversário</option>
                    <option value="Comemoracao">Comemoração</option>
                    <option value="outro">Outro</option>
                </select>
            </div>
            <div class="form-row">
                <label for="outro">Se "Outro" acima, especifique</label>
                <input
                    type="text"
                    id="outro"
                    name="outro"
                >
            </div>
            <div class="form-row">
                <label for="pedidos">Pedidos Especiais</label>
                <textarea
                    id="pedidos"
                    name="pedidos"
                    rows="2"
                ></textarea>
            </div>
        </form>
        <footer class="form-footer">
            <button type="submit" form="reserva">Enviar</button>
        </footer>
    </div>  
</body>
</html>
