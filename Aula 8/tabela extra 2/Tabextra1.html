<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fechamento de Vendas por Vendedor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

    <h2>Fechamento de Vendas por Vendedor</h2>

    <div class="table-toutch">
        <table>
            <thead>
                <tr>
                    <th>Vendedor</th>
                    <th>Região</th>
                    <th>Vendas (UN)</th>
                    <th>Total Faturado</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Ana Silva</td>
                    <td>Sudeste</td>
                    <td>142</td>
                    <td>R$ 56.800,00</td>
                </tr>

                <tr>
                    <td>Carlos Oliveira</td>
                    <td>Sul</td>
                    <td>98</td>
                    <td>R$ 39.200,00</td>
                </tr>

                <tr>
                    <td>Mariana Santos</td>
                    <td>Nordeste</td>
                    <td>115</td>
                    <td>R$ 46.000,00</td>
                </tr>

                <tr>
                    <td>Roberto Lima</td>
                    <td>Centro-Oeste</td>
                    <td>87</td>
                    <td>R$ 34.800,00</td>
                </tr>

                <tr class="total">
                    <td colspan="2">Total Geral</td>
                    <td>442</td>
                    <td>R$ 176.800,00</td>
                </tr>
            </tbody>
        </table>
    </div>


    
</body>
</html>
